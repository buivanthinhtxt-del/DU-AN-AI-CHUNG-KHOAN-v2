Viết cho tôi một đoạn code Python tạo ra 100 số ngẫu nhiên và in ra màn hình



import cv2
from inference_sdk import InferenceHTTPClient

# =======================================================================
# BƯỚC 1: CẤU HÌNH MÔ HÌNH NHẬN DIỆN MŨ BẢO HIỂM (ROBOFLOW)
# =======================================================================

# TODO: TRỌNG TÂM - Bạn hãy dán API Key của bạn vào dòng dưới đây nhé (Nằm ở trang Roboflow)
ROBOFLOW_API_KEY = "BKVF1aqOkiG6PBbb3usu"
MODEL_ID = "helmet-eogse/2" # Dựa trên ảnh bạn chụp, đây là ID mô hình của bạn

# Khởi tạo cầu nối (Client) gửi ảnh qua mạng lên server của Roboflow
try:
    client = InferenceHTTPClient(
        api_url="https://detect.roboflow.com",
        api_key=ROBOFLOW_API_KEY
    )
    print("[INFO] Đã kết nối sẵn sàng với Roboflow.")
except Exception as e:
    print(f"[LỖI Khởi tạo] Vui lòng kiểm tra lại thư viện hoặc mạng. Lỗi: {e}")

# =======================================================================
# BƯỚC 2: MỞ CAMERA VÀ BẮT ĐẦU THEO DÕI
# =======================================================================

print("[INFO] Đang mở Camera... Nhấn 'q' để thoát. Nhấn 's' để chụp 1 tấm nhờ AI kiểm tra!")
# Mở Webcam máy tính (Số 0 thường là webcam mặc định của Laptop)
cap = cv2.VideoCapture(0)

# Biến đếm để không bị gửi liên tục lên server (tốn bộ nhớ và chậm mạng)
frame_count = 0 

while True:
    ret, frame = cap.read()
    if not ret:
        print("[LỖI] Không thể đọc hình ảnh từ Camera.")
        break
    
    # Hiển thị camera lên màn hình theo thời gian thực
    cv2.imshow("Camera Giam Sat An Toan", frame)
    
    # Lắng nghe các phím bấm
    key = cv2.waitKey(1) & 0xFF
    
    # Kịch bản 1: Nhấn 'q' để Quits
    if key == ord('q'):
        print("Đã thoát chương trình.")
        break
        
    # Kịch bản 2: Nhấn dòng 's' để Scan (Quét ảnh)
    elif key == ord('s'):
        print("-" * 50)
        print("📸 Đang gửi ảnh lên AI để kiểm tra mũ bảo hiểm...")
        try:
            # Gửi ảnh frame lên API
            result = client.infer(frame, model_id=MODEL_ID)
            
            # Kết quả là một File JSON (ngôn ngữ kết nối API)
            print("Kết quả AI phân tích được:")
            
            predictions = result.get('predictions', [])
            if len(predictions) == 0:
                print("-> Không phát hiện thấy ai/cái gì đáng chú ý trong khung hình.")
            else:
                for obj in predictions:
                    ten_vat_the = obj['class']
                    do_tu_tin = obj['confidence'] * 100
                    print(f"-> Phát hiện: {ten_vat_the} (Độ tự tin: {do_tu_tin:.1f}%)")
                    
                    # Rất tốt: Chúng ta sẽ lấy đoạn này bắn sang N8N (ở bước sau)
                    if ten_vat_the == "no-helmet" or ten_vat_the == "khong_mu": # Tùy vào lúc bạn gán nhãn
                        print("🚨 CẢNH BÁO: PHÁT HIỆN NGƯỜI LÀM VIỆC KHÔNG ĐỘI MŨ!")
                        
        except Exception as e:
            print(f"[LỖI API] Lỗi khi gọi AI: {e}")

# Dọn dẹp bộ nhớ máy tính
cap.release()
cv2.destroyAllWindows()
